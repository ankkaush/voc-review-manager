services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voc
      POSTGRES_PASSWORD: voc
      POSTGRES_DB: voc
    ports:
      # Host port 5435: several other local projects already occupy 5432-5434.
      - "5435:5432"
    volumes:
      - voc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://voc:voc@db:5432/voc
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  voc_db_data:
