name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voc
          POSTGRES_PASSWORD: voc
          POSTGRES_DB: voc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://voc:voc@localhost:5432/voc
      JWT_SECRET: ci-test-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-test-password
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
